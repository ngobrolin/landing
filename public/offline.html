<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Ngobrolin</title>
    <meta name="description" content="Kamu sedang offline. Tonton episode yang sudah tersimpan.">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #ff6b6b;
            --border: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex: 1;
        }

        .offline-icon {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .cached-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .cached-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        #cached-list {
            list-style: none;
        }

        #cached-list li {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        #cached-list li:last-child {
            border-bottom: none;
        }

        #cached-list a {
            color: var(--text-primary);
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }

        #cached-list a:hover {
            color: var(--accent);
        }

        .home-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 0.25rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .home-link:hover {
            opacity: 0.9;
        }

        .no-cache {
            color: var(--text-secondary);
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">📡</div>
        <h1>Kamu sedang offline</h1>
        <p class="subtitle">Periksa koneksi internet kamu atau tonton episode yang sudah tersimpan.</p>

        <div class="cached-section">
            <h2>Episode Tersimpan</h2>
            <ul id="cached-list">
                <li class="no-cache">Memuat episode tersimpan...</li>
            </ul>
        </div>

        <a href="/" class="home-link">Kembali ke Beranda</a>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Ngobrolin. Semua hak dilindungi.</p>
    </footer>

    <script>
        (function() {
            'use strict';

            // Set current year
            document.getElementById('year').textContent = new Date().getFullYear();

            // Load cached episodes from ngobrol-pages-v1 cache
            async function loadCachedEpisodes() {
                const cachedList = document.getElementById('cached-list');

                try {
                    if (!('caches' in window)) {
                        cachedList.innerHTML = '<li class="no-cache">Browser tidak mendukung cache.</li>';
                        return;
                    }

                    const cache = await caches.open('ngobrol-pages-v1');
                    const keys = await cache.keys();

                    // Filter for episode pages only
                    const episodeKeys = keys
                        .filter(request => request.url.includes('/episodes/') && !request.url.includes('.json'))
                        .sort((a, b) => a.url.localeCompare(b.url));

                    if (episodeKeys.length === 0) {
                        cachedList.innerHTML = '<li class="no-cache">Belum ada episode yang tersimpan. Kunjungi halaman episode saat online untuk menyimpannya.</li>';
                        return;
                    }

                    // Generate list items
                    const listItems = await Promise.all(episodeKeys.map(async (request) => {
                        const response = await cache.match(request);
                        const html = await response.text();

                        // Extract episode title from HTML
                        const titleMatch = html.match(/<title>([^<]+)<\/title>/);
                        const title = titleMatch ? titleMatch[1].replace(' - Ngobrolin', '').trim() : 'Episode Tanpa Judul';

                        // Extract slug from URL
                        const slugMatch = request.url.match(/\/episodes\/([^\/]+)\/?/);
                        const slug = slugMatch ? slugMatch[1] : '';

                        return `<li><a href="/episodes/${slug}/">${title}</a></li>`;
                    }));

                    cachedList.innerHTML = listItems.join('');

                } catch (error) {
                    console.error('Error loading cached episodes:', error);
                    cachedList.innerHTML = '<li class="no-cache">Gagal memuat episode tersimpan.</li>';
                }
            }

            // Load cached episodes when page loads
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadCachedEpisodes);
            } else {
                loadCachedEpisodes();
            }
        })();
    </script>
</body>
</html>
