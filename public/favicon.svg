<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The cover's two bands, at 32px. Keep in step with src/styles/global.css. -->
  <defs>
    <linearGradient id="brand-band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6588fe"/>
      <stop offset="100%" stop-color="#a76ab7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#brand-band)"/>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">N</text>
</svg>
