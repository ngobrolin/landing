name: Fetch YouTube Playlist

on:
  schedule:
    # Every Wednesday at 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 3'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch playlist data
        run: npx tsx scripts/fetch-playlist.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/episodes.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/episodes.json
          git commit -m "Update episodes from YouTube playlist"
          git push
