name: Fetch YouTube Playlist

on:
  schedule:
    # Every Wednesday at 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 3'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: >-
          Authorize a sync-floor shrink of at most this many episodes (ALLOW_SYNC_SHRINK).
          Type the count the refusal message printed — not true/yes, which authorize nothing.
          A larger drop still refuses. Leave empty to stay guarded; per-run either way.
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch playlist data
        run: pnpm exec tsx scripts/fetch-playlist.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ALLOW_SYNC_SHRINK: ${{ inputs.allow_shrink || '' }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/episodes.json src/data/tags.json src/data/channel-subscribers.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update episodes and tags from YouTube playlist"
          branch: update-episodes-from-youtube
          title: "chore: update episodes from YouTube playlist"
          body: |
            Automated update from YouTube playlist.

            This PR updates `src/data/episodes.json` and `src/data/tags.json` with the latest data from the YouTube API.

            It may also update `src/data/channel-subscribers.json` — the channel subscriber
            count `/partners` publishes, read from `channels.list` with the same read-only key.
            That file only changes when the count itself moves, so most runs leave it alone.
            If the channel call failed this run, the last known figure is left in place and the
            step log says so; the episode work above is unaffected either way.
          delete-branch: true
