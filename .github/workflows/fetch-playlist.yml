name: Fetch YouTube Playlist

on:
  schedule:
    # Every Wednesday at 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 3'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch playlist data
        run: npx tsx scripts/fetch-playlist.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/episodes.json src/data/tags.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update episodes and tags from YouTube playlist"
          branch: update-episodes-from-youtube
          title: "chore: update episodes from YouTube playlist"
          body: |
            Automated update from YouTube playlist.

            This PR updates `src/data/episodes.json` and `src/data/tags.json` with the latest data from the YouTube API.
          delete-branch: true
